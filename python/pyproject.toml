[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "lexdays"
version = "0.2.0"
description = "Explainable legal deadline and business-day calculator. Every result cites the rule it applied. Zero dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "DoGood-Studio" }]
keywords = [
  "legal deadline", "deadline calculator", "business days", "working days",
  "holidays", "court rules", "rules as code", "statute of limitations",
  "süre hesaplama", "iş günü", "adli tatil", "Turkey", "Türkiye",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Legal Industry",
  "Intended Audience :: Financial and Insurance Industry",
  "Natural Language :: English",
  "Natural Language :: Turkish",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Scheduling",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []

[project.scripts]
lexdays = "lexdays.cli:main"

[project.urls]
Homepage = "https://github.com/DoGood-Studio/legal-deadline-calculator"
Documentation = "https://github.com/DoGood-Studio/legal-deadline-calculator#readme"
Repository = "https://github.com/DoGood-Studio/legal-deadline-calculator"
Issues = "https://github.com/DoGood-Studio/legal-deadline-calculator/issues"
Changelog = "https://github.com/DoGood-Studio/legal-deadline-calculator/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "hypothesis>=6.120",
  "mypy>=1.13",
  "ruff>=0.8",
  "jsonschema>=4.23",
]

[tool.hatch.build]
artifacts = ["src/lexdays/_data/"]

[tool.hatch.build.targets.wheel]
packages = ["src/lexdays"]

[tool.hatch.build.hooks.custom]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
xfail_strict = true

[tool.coverage.run]
source = ["lexdays"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "raise NotImplementedError"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "C4", "PT"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC0415"]
