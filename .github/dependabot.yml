version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /js
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # TypeScript 7 has no JavaScript compiler API, which tsup 9 needs for the .d.ts build
      # (egoist/tsup#1405). Remove this once tsup supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: uv
    directory: /python
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        patterns: ["*"]
