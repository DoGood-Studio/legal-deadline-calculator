name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1" # weekly: catches upstream changes in python-holidays and toolchains
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest --cov --cov-report=term --cov-fail-under=95
      - name: Build and smoke-test the wheel in an isolated environment
        shell: bash
        run: |
          uv build
          uv run --isolated --no-project --with "$(ls dist/*.whl)" lexdays deadline tr/hmk 2026-07-30 P2W

  javascript:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24] # the dev toolchain (vitest, tsup) needs Node 22+
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run

  node-runtime:
    name: Built package on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: cd js && npm ci --ignore-scripts && npm run build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: node js/scripts/smoke.mjs && node js/scripts/smoke.cjs

  consistency:
    name: Generated files and cross-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
      - name: Differential vectors are up to date
        run: |
          uv run --project python python scripts/gen_differential.py
          git diff --exit-code vectors/generated/
      - name: Every calendar has verified data for at least six more months
        run: uv run --project python python scripts/check_coverage.py --months 6
      - name: Demo language pages and sitemap are up to date
        run: |
          node scripts/build-site-pages.mjs
          git diff --exit-code site/
          test -z "$(git status --porcelain site/)"
      - name: Calendars agree with python-holidays and the GOV.UK feed
        run: |
          curl -fsSL https://www.gov.uk/bank-holidays.json -o "$RUNNER_TEMP/bank-holidays.json"
          uv run --project python --with holidays python scripts/crosscheck_calendars.py --govuk "$RUNNER_TEMP/bank-holidays.json"
