name: Release

# Publishes to PyPI and npm with Trusted Publishing (OIDC, no long-lived tokens)
# when a GitHub Release is published. One-time setup is described in RELEASING.md.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Versions match the release tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(grep -m1 '^version' python/pyproject.toml | cut -d'"' -f2)
          js=$(node -p "require('./js/package.json').version")
          echo "tag=$tag python=$py npm=$js"
          test "$tag" = "$py" && test "$tag" = "$js"
      - run: cd python && uv sync --locked && uv run pytest -q && uv build
      - run: cd js && npm ci --ignore-scripts && npm test && npm run build && npm pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: python/dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-dist
          path: js/lexdays-*.tgz

  # Signs the built packages with Sigstore (keyless, through this workflow's identity) and
  # attaches the packages and their .sigstore.json bundles to the GitHub release, so anyone can
  # check that a file came from this repository's release workflow:
  #   python -m sigstore verify github --repository DoGood-Studio/legal-deadline-calculator lexdays-<version>.tar.gz
  sign:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the files to the release
      id-token: write # Sigstore signing identity
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/
          merge-multiple: true
      - uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: ./dist/*.tar.gz ./dist/*.whl ./dist/*.tgz

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  npm:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-dist
      # The first version is published by hand (trusted publishing needs an existing package),
      # so a version that is already on npm is skipped instead of failing the release.
      - name: Publish unless this version is already on npm
        run: |
          version=$(tar -xOzf lexdays-*.tgz package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          if npm view "lexdays@$version" version >/dev/null 2>&1; then
            echo "lexdays@$version is already on npm; nothing to publish."
          else
            npm publish lexdays-*.tgz --access public
          fi
