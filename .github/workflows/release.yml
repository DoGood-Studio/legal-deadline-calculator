name: Release

# Publishes to PyPI and npm with Trusted Publishing (OIDC, no long-lived tokens)
# when a GitHub Release is published. One-time setup is described in RELEASING.md.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Versions match the release tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(grep -m1 '^version' python/pyproject.toml | cut -d'"' -f2)
          js=$(node -p "require('./js/package.json').version")
          echo "tag=$tag python=$py npm=$js"
          test "$tag" = "$py" && test "$tag" = "$js"
      - run: cd python && uv sync --locked && uv run pytest -q && uv build
      - run: cd js && npm ci --ignore-scripts && npm test && npm run build && npm pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: python/dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-dist
          path: js/lexdays-*.tgz

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  npm:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-dist
      # The first version is published by hand (trusted publishing needs an existing package),
      # so a version that is already on npm is skipped instead of failing the release.
      - name: Publish unless this version is already on npm
        run: |
          version=$(tar -xOzf lexdays-*.tgz package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          if npm view "lexdays@$version" version >/dev/null 2>&1; then
            echo "lexdays@$version is already on npm; nothing to publish."
          else
            npm publish lexdays-*.tgz --access public
          fi
